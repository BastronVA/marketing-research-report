<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Интерактивный маркетинговый отчёт</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">Research Report</div>
    <nav id="nav"></nav>
    <div class="sidebar-actions">
      <label class="file-label">
        Загрузить JSON
        <input id="fileInput" type="file" accept=".json,application/json">
      </label>
      <button id="printBtn" type="button">Печать / PDF</button>
    </div>
  </aside>

  <main>
    <section class="hero">
      <p class="eyebrow">Маркетинговое исследование</p>
      <h1 id="projectName">Загрузите report-data.json</h1>
      <p id="projectMeta" class="muted"></p>
      <div id="confidenceBadge"></div>
      <div id="statusMessage" class="status" role="status" aria-live="polite"></div>
    </section>
    <div id="content"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
